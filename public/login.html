<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h2>Login</h2>

            <p>Login to your account</p>

            <form id="loginForm">

                <div class="form-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <p class="form-link">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </div>

    <p>
    Didn't receive your verification email, or has it expired?
</p>

<form id="resendForm">
    <input
        type="email"
        id="resendEmail"
        placeholder="Enter your registered email"
        required
    >

    <button type="submit">
        Resend Verification Email
    </button>
</form>

<p id="resendMessage"></p>



    <script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({
                    email,
                    password
                })
            });

            const data = await response.json();

            console.log("Status:", response.status);
            console.log("Response:", data);

            if (!response.ok) {
                alert(data.message || "Login failed");
                return;
            }

            // Save token
            localStorage.setItem("token", data.token);

            // Get logged-in user
            const user = data.data;

            // Save user information
            localStorage.setItem("user", JSON.stringify(user));

            // Redirect based on role
            if (user.role === "admin") {
                window.location.href = "admin/admin.html";
            } else {
                window.location.href = "products.html";
            }


        } catch (error) {
            console.error("Login error:", error);
            alert("Server error");
        }
    });



    document.getElementById("resendForm").addEventListener(
        "submit",
        async function (event) {
            event.preventDefault();

            const email =
                document.getElementById("resendEmail").value;

            const message =
                document.getElementById("resendMessage");

            try {
                const response = await fetch(
                    "/api/auth/resend-verification",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ email })
                    }
                );

                const data = await response.json();
                message.textContent = data.message;

            } catch (error) {
                message.textContent =
                    "Unable to connect. Please try again.";
            }
        }
    );

</script>
</body>
</html>
